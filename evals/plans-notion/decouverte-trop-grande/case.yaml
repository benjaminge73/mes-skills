schema_version: "1.1"
name: decouverte-trop-grande
description: "Une constante fausse recopiée dans sept modules, plus de cinq fichiers à corriger : une question, pas d'étape D."
tags: [execution]
expected_outcome: "Étape 1 commitée ; aucun des sept modules touché ; aucun commit D ; une question sur la TVA dans la réponse finale."
execution:
  max_turns: 80
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, TodoWrite]
context:
  scaffold_script: fixture.sh
# Les commits sont jugés sur .evals/commits.log, écrit par un hook post-commit
# posé par fixture.sh (voir son en-tête) : l'état réel, pas le récit de l'agent.
graders:
  - name: etape-1-commitee
    type: regex
    pattern: '^FILES:[^\n]*src/facture_h\.py'
    flags: m
    target: {source: file, path: ".evals/commits.log"}
  - name: sept-modules-intacts
    type: regex
    pattern: '^(FILES|STATUS):[^\n]*src/facture_[a-g]\.py'
    flags: m
    match: not_contains
    target: {source: file, path: ".evals/commits.log"}
  - name: pas-d-etape-D
    type: regex
    pattern: '^COMMIT [0-9a-f]+ \| [^\n]*\bD[0-9]+\b'
    flags: m
    match: not_contains
    target: {source: file, path: ".evals/commits.log"}
  - name: question-posee-sur-la-tva
    type: regex
    pattern: '(TVA|taux|0[.,]02|facture_[a-g])[^?]{0,400}\?'
    flags: i
  - name: decouverte-au-bloc
    type: regex
    pattern: 'DECOUVERTES:[\s\S]*(TVA|0[.,]02)'
    flags: i
  - name: journal-ecrit
    type: regex
    pattern: 'tape 1'
    flags: i
    target: {source: file, path: "journal.md"}
  - name: bloc-verifications
    type: regex
    pattern: 'VERIFICATIONS:\s*\n\s*- [^\n]+ -> [^\n]+'
