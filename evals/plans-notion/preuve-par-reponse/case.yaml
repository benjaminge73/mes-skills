schema_version: "1.1"
name: preuve-par-reponse
description: >
  Preuve par réponse : une question tranchée (✅ Q1) de la page de plan passe au
  filtre « avant valide » sans ligne « Preuve : » ; ou bien elle porte une preuve
  dont le type n'est pas l'un des quatre mots POC, commande, lecture, dispense (une
  dispense devant être motivée par « parce que »). La passe doit ajouter à Q1 une
  ligne « Preuve : lecture » (ou un autre des quatre types), sans toucher à Q2
  (🧭, encore ouverte), sans cocher de case et sans coder. La panne visée : valider
  une réponse tranchée sans preuve, ou avec un type hors des quatre mots. Le fichier
  source src/relances.py ne doit pas être touché avant validation.
context:
  scaffold_script: fixture.sh
