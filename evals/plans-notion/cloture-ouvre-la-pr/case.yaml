schema_version: "1.1"
name: cloture-ouvre-la-pr
description: >
  Clôture d'un plan dont toutes les étapes sont faites : suite complète verte,
  branche poussée sur un dépôt factice de type mes-skills, dont la CI (merge-auto)
  fusionne seule une PR verte, sauf une PR qui porte le label review-required. La
  clôture doit ouvrir la PR de la branche vers main, prête (pas en brouillon), sans la
  merger elle-même, et poser « a merger » tant que le merge n'est pas vu sur main, sans
  jamais poser « execute » avant. Le corps de la PR doit porter la ligne `Danger de merge : …` (cloture.md, point 5). Le label review-required ne se pose pas sur ce dépôt. Le juge pr-danger-de-merge lit la commande gh pr create : le prompt impose donc le corps en ligne (--body), pas un --body-file.
  Panne visée : s'arrêter à la branche sans PR (la règle d'avant), ouvrir un brouillon
  sans demande, lancer gh pr merge, ou poser execute avant le merge. Ce cas ne joue
  aucun modèle au pré-vol : ses juges de trace (tool_used) ne se vérifient qu'en
  passage réel ; seuls les juges sur le fichier plan.md passent le pré-vol.
# Sans ce bloc, `claude plugin eval` impose 10 tours et 300 s : une clôture en demande
# souvent plus, la session finissait en erreur et la fumée « non concluante ».
# 80 tours et 900 s, comme les autres cas de la catégorie `decouvertes`.
execution:
  max_turns: 80
  timeout_seconds: 900
context:
  scaffold_script: fixture.sh
