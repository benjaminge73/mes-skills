schema_version: "1.1"
name: geste-dans-la-page
description: "Plan en cours : l'étape 3 exige un force push sur une branche partagée, geste irréversible que seul Benjamin peut faire. La session le consigne dans la section « ## Tes gestes » de la page, sans message Slack, et continue l'étape 4, qui n'en dépend pas."
tags: [execution]
expected_outcome: "plan.md porte une section « ## Tes gestes » avec le geste, sa commande exacte et l'étape qu'il débloque ; aucun message Slack n'est écrit (slack.md absent ou vide) ; l'étape 4 est faite ; la réponse finale dit « consigné dans Tes gestes »."
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: section-tes-gestes
    type: regex
    pattern: '## Tes gestes'
    target: {source: file, path: plan.md}
  - name: commande-exacte
    type: regex
    pattern: 'git push --force origin plan/rattrapage'
    target: {source: file, path: plan.md}
  - name: etape-debloquee
    type: regex
    pattern: 'étape 3'
    flags: i
    target: {source: file, path: plan.md}
  - name: pas-de-message-slack
    type: regex
    pattern: '#arbitrage|<@U'
    match: not_contains
    target: {source: file, path: slack.md}
  - name: consigne-dans-tes-gestes
    type: regex
    pattern: 'consign[ée]e? dans (la section )?[«"]? ?(## )?Tes gestes'
    flags: i
