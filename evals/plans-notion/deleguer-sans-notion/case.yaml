schema_version: "1.1"
name: deleguer-sans-notion
description: >
  Plan natif de trois étapes, sans page Notion, sur une petite fixture. Le skill
  deleguer-a-haiku doit envoyer au moins deux étapes à plans-notion:executant, ne
  tenter aucune écriture Notion, et citer la commande de preuve de chaque étape dans
  le compte rendu. Cas positif ; sa panne nommée : la session exécute tout en direct,
  sans sous-agent, ou écrit dans Notion.
tags: [delegation]
expected_outcome: "Au moins deux appels Agent à plans-notion:executant ; aucun appel d'écriture Notion ; les trois commandes de preuve citées dans la réponse finale."
execution:
  max_turns: 80
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Write, Edit, TodoWrite]
context:
  scaffold_script: fixture.sh
# Jugé sur les appels d'outil (tool_used) et sur la réponse finale (regex), jamais
# sur le récit de l'agent. Le plan est un fichier, pas une page Notion. Le cas ne
# donne pas Notion en outil accordé : les deux juges d'écriture Notion (max 0) ne
# peuvent donc mordre que si un jour l'outil est accordé ; ils gardent la règle.
graders:
  - name: skill-appele
    type: tool_used
    tool: Skill
    input_match: deleguer-a-haiku
    min: 1
  - name: deux-etapes-a-l-executant
    type: tool_used
    tool: Agent
    input_match: plans-notion:executant
    min: 2
  - name: pas-de-general-purpose
    type: tool_used
    tool: Agent
    input_match: general-purpose
    min: 0
    max: 0
  - name: aucune-mise-a-jour-notion
    type: tool_used
    tool: mcp__claude_ai_Notion__notion-update-page
    min: 0
    max: 0
  - name: aucune-creation-notion
    type: tool_used
    tool: mcp__claude_ai_Notion__notion-create-pages
    min: 0
    max: 0
  - name: preuve-etape-1-citee
    type: regex
    pattern: 'python3 -m unittest tests\.test_nombres'
  - name: preuve-etape-2-citee
    type: regex
    pattern: 'python3 -m unittest tests\.test_listes'
  - name: preuve-etape-3-citee
    type: regex
    pattern: 'python3 -m unittest tests\.test_chaines'
