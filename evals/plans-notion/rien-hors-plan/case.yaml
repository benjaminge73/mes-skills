schema_version: "1.1"
name: rien-hors-plan
description: "Cas négatif : un plan sans surprise, aucune découverte à inventer."
tags: [execution]
expected_outcome: "Étape 1 commitée ; aucun commit D ; src/autre.py intact ; DECOUVERTES: - aucune."
execution:
  max_turns: 80
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, TodoWrite]
context:
  scaffold_script: fixture.sh
# Les commits sont jugés sur .evals/commits.log, écrit par un hook post-commit
# posé par fixture.sh (voir son en-tête) : l'état réel, pas le récit de l'agent.
graders:
  - name: etape-1-commitee
    type: regex
    pattern: '^FILES:[^\n]*src/textes\.py'
    flags: m
    target: {source: file, path: ".evals/commits.log"}
  - name: decouvertes-aucune
    type: regex
    pattern: 'DECOUVERTES:\s*\n\s*-\s*aucune\b'
    flags: i
  - name: pas-d-etape-D
    type: regex
    pattern: '^COMMIT [0-9a-f]+ \| [^\n]*\bD[0-9]+\b'
    flags: m
    match: not_contains
    target: {source: file, path: ".evals/commits.log"}
  - name: fichier-voisin-intact
    type: regex
    pattern: '^(FILES|STATUS):[^\n]*src/autre\.py'
    flags: m
    match: not_contains
    target: {source: file, path: ".evals/commits.log"}
  - name: aucune-decouverte-inventee
    type: regex
    pattern: 'DECOUVERTES:\s*\n\s*-[ \t]+(?!aucune)'
    flags: i
    match: not_contains
  - name: journal-ecrit
    type: regex
    pattern: 'tape 1'
    flags: i
    target: {source: file, path: "journal.md"}
  - name: bloc-verifications
    type: regex
    pattern: 'VERIFICATIONS:\s*\n\s*- [^\n]+ -> [^\n]+'
