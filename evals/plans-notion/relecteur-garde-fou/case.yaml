schema_version: "1.1"
name: relecteur-garde-fou
description: "Le relecteur, joué sur la plage d'une étape, signale un @unittest.skip ajouté sans justification à un test qui attrapait un vrai bug : REMARQUES, avec le fichier:ligne du test et le scénario du bug que la suite verte laisse passer."
tags: [execution]
expected_outcome: "Verdict REMARQUES (n) ; le @unittest.skip de tests/test_remise.py est signalé avec son fichier:ligne et le test qui le porte ; le bug de src/remise.py (>= au lieu de >, remise(100) rend 90) est donné comme scénario."
# Lecture seule : ni Write ni Edit. 40 tours et 600 s, pour la relecture de deux
# commits ; le défaut de claude plugin eval (10 tours, 300 s) ne suffirait pas.
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash]
context:
  scaffold_script: fixture.sh
# Juges gratuits, sur la réponse finale : le pré-vol les joue sur oracle/reponse.md.
graders:
  - name: verdict-remarques
    type: regex
    pattern: 'REMARQUES \(\d+\)'
  - name: skip-signale
    type: regex
    pattern: 'skip'
    flags: i
  - name: skip-nomme-le-test
    type: regex
    pattern: 'test_pas_de_remise_a_exactement_100_euros'
  - name: skip-fichier-ligne
    type: regex
    pattern: 'tests/test_remise\.py:\d+'
  - name: bug-fichier-ligne
    type: regex
    pattern: 'src/remise\.py:\d+'
  - name: bug-scenario-valeurs
    type: regex
    pattern: '100[^\n]*\b90\b|\b90\b[^\n]*100'
