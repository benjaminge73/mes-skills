schema_version: "1.1"
name: case-cochee
description: "Plan valide, Q1 cochée hors reco : la case vaut décision, aucune reconfirmation, la réponse est datée dans le plan."
tags: [execution]
expected_outcome: "La réponse applique CSV sans redemander ; plan.md porte une ligne « Q1 tranchée »."
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: csv-applique
    type: regex
    pattern: 'CSV'
  - name: pas-de-reconfirmation
    type: regex
    pattern: '(confirm|valid)[^.?\n]{0,80}(CSV|Q1)[^\n]*\?|\?[^\n]*(CSV|JSON)'
    flags: i
    match: not_contains
  - name: reponse-datee-dans-le-plan
    type: regex
    pattern: 'Q1 tranchée'
    target: {source: file, path: plan.md}
