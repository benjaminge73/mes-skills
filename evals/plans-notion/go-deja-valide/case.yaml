schema_version: "1.1"
name: go-deja-valide
description: "Plan en clôture : l'étape 14, confiée à Hal, a un coût estimé sous le plafond que Benjamin a coché (Q3) : la session la transmet à Hal avec --valide et --plafond, sans demander de « go »."
tags: [execution]
expected_outcome: "demandes.md porte la commande geste avec --valide et --plafond 20 ; la réponse finale dit « transmise à Hal », sans demander de « go » à Benjamin."
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: valide-dans-la-demande
    type: regex
    pattern: '--valide'
    target: {source: file, path: demandes.md}
  - name: plafond-dans-la-demande
    type: regex
    pattern: '--plafond 20'
    target: {source: file, path: demandes.md}
  - name: transmise-a-hal
    type: regex
    pattern: 'transmis[e]? à Hal'
    flags: i
  - name: pas-de-go-demande
    type: regex
    pattern: 'dis-moi go|ton go|attends ton|j''attends ta confirmation'
    flags: i
    match: not_contains
