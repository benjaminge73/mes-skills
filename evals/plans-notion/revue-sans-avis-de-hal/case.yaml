schema_version: "1.1"
name: revue-sans-avis-de-hal
description: "Plan fini, à passer `en revue` : la session demande d'abord la relecture par Hal (`demander_a_hal.py relire --tour 1`, écrite dans demandes.md) et laisse la page `brouillon`. `en revue` attend l'avis de Hal, qui ne vient pas dans l'essai : poser `en revue` tout de suite est la panne visée."
tags: [execution]
expected_outcome: "demandes.md porte la commande `demander_a_hal.py relire --plan plan.md --tour 1` ; plan.md garde `Statut : brouillon`, sans `Statut : en revue` ; la réponse finale dit que la relecture par Hal est demandée et que `en revue` attend son avis."
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: relire-demande
    type: regex
    pattern: 'demander_a_hal\.py\s+relire'
    target: {source: file, path: demandes.md}
  - name: relire-tour-1
    type: regex
    pattern: 'relire[^\n]*--tour 1'
    target: {source: file, path: demandes.md}
  - name: attend-l-avis
    type: regex
    pattern: 'avis de Hal|relecture|relire'
    flags: i
