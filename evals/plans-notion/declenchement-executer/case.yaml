schema_version: "1.1"
name: declenchement-executer
description: "Plan `valide` dans le dépôt, Benjamin écrit « go » sans nommer aucun skill : la session doit charger executer-plan-notion d'après sa description, et ne rien coder avant la préparation. Cas positif ; sa panne nommée : la description raccourcie ne charge plus le skill sur « go », et la session écrit hello.txt tout de suite."
tags: [execution]
expected_outcome: "Le skill executer-plan-notion chargé ; hello.txt non créé ; la réponse finale dit que le plan est valide et que rien n'est codé avant la préparation."
# Une seule formulation par cas : celle-ci est « go ». Les autres déclencheurs de la description
# (« vas-y », « reprends là où on s'est arrêté », « ouvre la PR ») n'ont pas de cas à eux seuls.
# Le juge skill-appele se lit dans la trace (tool_used) : il ne se vérifie pas au pré-vol, seuls
# les deux autres juges (fichier, réponse) le sont.
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-appele
    type: tool_used
    tool: Skill
    input_match: executer-plan-notion
    min: 1
  - name: rien-code-avant-preparation
    type: file_exists
    path: "hello.txt"
    exists: false
  - name: statut-lu
    type: regex
    pattern: 'valide'
    flags: i
