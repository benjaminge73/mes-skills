name: CI

on:
  # Jamais le déclencheur « cible » de la PR (celui qui exécute le code d'une PR
  # avec les secrets du dépôt, donc avec le jeton du job `evals`). Pas de filtre `paths:` ici non
  # plus : un workflow que le filtre empêcherait de démarrer ne rendrait aucun
  # statut, et un futur verrou de branche (ruleset) attendrait indéfiniment.
  # Le tri par chemins se fait dans le job `evals-portee`, dont le résultat
  # fait sauter `evals` (un job sauté compte comme réussi). Le job
  # `evals-verdict` (nom fixe) est le seul contrôle d'évals que le verrou de
  # `main` puisse exiger : le nom de `evals` change avec la matrice.
  #
  # Pas de `types: [.., edited]`, et c'est voulu. L'édition d'une PR (un titre, le
  # corps) rejouerait toute la CI : `evals` serait sauté, et le
  # « Verdict des évals » de ce run serait vert sur ce SHA alors que ses évals
  # étaient rouges. Le verrou de `main` risque de ne voir que ce dernier statut.
  # Le corps de la PR, lui, porte la ligne `Evals:` (les catégories à jouer) :
  # `evals-portee` le relit donc par l'API à chaque run, au lieu de lire le
  # payload de l'événement (qui est celui d'origine, périmé). Corriger la ligne
  # `Evals:`, puis « Re-run all jobs » ou pousser un commit, suffit.
  #
  # Les évals se jouent à la demande : seulement si la PR porte le label `evals`.
  # `labeled` s'ajoute donc aux types par défaut, pour que poser le label lance le
  # run sans rien pousser. Les labels sont relus par l'API comme le corps, jamais
  # lus dans l'événement : un « Re-run » rejoue le payload d'origine, dont les
  # labels sont périmés (même trou que `edited`, fermé de la même façon). Sans le
  # label, une PR qui touche un skill, un agent, un hook ou un `_partage/` doit
  # porter `Evals: aucun — <raison>` dans son corps, sinon `evals-portee` est
  # rouge et le verdict avec lui.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "ab : l'A/B habituel (la tête contre sa base). aa : joue la tête deux fois pour mesurer le bruit du modèle courant (EVALS_MODELE, EVALS_EFFORT), sur tout le banc, sans lire ni écrire le cache de la base ; le fichier de bruit est publié en artefact."
        type: choice
        options:
          - ab
          - aa
        default: ab

permissions:
  contents: read

jobs:
  garde:
    name: Gardes de distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Le garde de version lit l'état de la branche de base avec
          # `git show` : à profondeur 1, ce commit n'est pas dans le clone et
          # tout plugin passerait pour naissant — donc vert sur rien.
          fetch-depth: 0

      - name: Contrôles de garde (scripts/ci_locale.sh)
        # La liste des contrôles vit dans `scripts/ci_locale.sh`, et nulle part
        # ailleurs : la CI l'appelle au lieu de recopier ses commandes, pour que
        # « ce qui passe en local » et « ce qui passe ici » soient la même liste.
        # Sur une PR, la base est la branche visée ; sur une poussée sur main,
        # il n'y a rien à comparer et les contrôles qui en dépendent sont sautés.
        env:
          BASE_REF: origin/${{ github.base_ref }}
          CI_LOCALE_SANS_BASE: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: scripts/ci_locale.sh garde

  validation:
    name: Validation des plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer la CLI Claude Code
        # Non épinglée volontairement : si le format des manifestes de plugin
        # change en amont, on veut que cette étape le dise (schéma qui bouge,
        # validation qui échoue) plutôt que de valider indéfiniment contre un
        # schéma qu'on aurait figé et qui serait devenu périmé.
        run: npm install -g @anthropic-ai/claude-code

      - name: Validation, tests et renvois (scripts/ci_locale.sh)
        # Même liste que `garde` : scripts/ci_locale.sh, section `validation`.
        run: scripts/ci_locale.sh validation

  evals-portee:
    name: Portée des évals
    # Mêmes garde-fous que `merge-auto`, plus « pas depuis un fork » : ce job
    # ouvre la voie à `evals`, qui porte le jeton CLAUDE_CODE_OAUTH_TOKEN et
    # joue du Bash. Un fork n'a de toute façon pas les secrets ; on le dit ici
    # plutôt que de laisser `evals` échouer sur « secret absent ».
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == 'benjaminge73')
      || (github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'benjaminge73'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # `pull-requests: read` : relire le corps de la PR par l'API, rien de plus.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touche: ${{ steps.portee.outputs.touche }}
      plugins: ${{ steps.portee.outputs.plugins }}
      base: ${{ steps.portee.outputs.base }}
      # Un objet JSON {plugin: sélection} : voir scripts/evals_selection.py.
      selection: ${{ steps.portee.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La tête de la PR, pas le commit de fusion que GitHub prépare : c'est
          # la version de tête qu'on compare. Profondeur complète : `git
          # merge-base` et `git archive <base>` lisent l'historique.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Pas de jeton GITHUB_TOKEN laissé dans .git/config : `evals` joue des
          # agents avec Bash dans ce clone.
          persist-credentials: false

      - name: Quels plugins jouer
        id: portee
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Le corps est relu par l'API (voir le script), avec ce jeton en lecture
          # seule et ce numéro : des entrées passées par l'environnement, jamais
          # interpolées dans le script.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Le label que l'événement `labeled` vient de poser (vide pour `opened`,
          # `synchronize` et `reopened`) : voir « label ajouté » plus bas.
          LABEL_AJOUTE: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          # --- corps de la PR (début)
          # Le corps est une entrée non fiable : il n'existe que dans la variable
          # d'environnement PR_BODY, jamais interpolé par une expression GitHub (ce
          # serait du code, pas une donnée). Relu par l'API et non lu dans le payload : un « Re-run »
          # rejoue le payload d'origine, dont le corps est périmé. Un échec de
          # l'appel est un échec du job, jamais un repli sur « tout » ni sur une
          # sélection vide : ce serait jouer (et payer) autre chose que ce que la
          # PR a demandé, sans le dire.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! PR_BODY=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""'); then
              echo "::error title=Corps de la PR illisible::L'appel à l'API GitHub pour relire le corps de la PR a échoué : la sélection des évals n'a pas pu être faite. Relancer le run (Re-run all jobs)."
              exit 1
            fi
            export PR_BODY
          fi
          # --- corps de la PR (fin)
          # --- labels (début)
          # Les évals se jouent à la demande : sans le label `evals`, `touche` vaut
          # `false`. Relus par l'API, pour la même raison que le corps (un
          # « Re-run » rejoue le payload d'origine, dont les labels sont périmés), et
          # un échec de l'appel est un échec du job : ni « le label est là » (on
          # paierait le banc), ni « il n'y est pas » (on sauterait des évals
          # demandées). Un lancement manuel vaut la demande : il joue tout le banc.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! LABELS=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name'); then
              echo "::error title=Labels de la PR illisibles::L'appel à l'API GitHub pour relire les labels de la PR a échoué : on ne sait pas si les évals sont demandées. Relancer le run (Re-run all jobs)."
              exit 1
            fi
          else
            LABELS=evals
          fi
          export LABELS
          # --- labels (fin)
          # Base = l'ancêtre commun de la PR et de `main`, pas la pointe de
          # `main` : si `main` a avancé depuis, ses changements ne sont pas un
          # « recul » de la PR. C'est aussi un SHA de `main`, la clé du cache.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
            # `--no-renames` : un fichier déplacé compte pour ses deux chemins.
            mapfile -t fichiers < <(git diff --no-renames --name-only "$base" "$PR_HEAD_SHA")
            global=0
          else
            base=$(git merge-base origin/main HEAD)
            fichiers=()
            global=1   # lancement manuel : tout plugin qui a un banc
          fi

          # Plugins jouables : un banc `evals/<plugin>/` et un plugin des deux
          # côtés (un plugin naissant n'a pas de base à comparer). `outillage`
          # est le dossier des scripts, pas un plugin.
          jouables=()
          for d in evals/*/; do
            nom=$(basename "$d")
            [ "$nom" = "outillage" ] && continue
            [ -d "plugins/$nom" ] || continue
            git cat-file -e "$base:plugins/$nom/.claude-plugin/plugin.json" 2>/dev/null || continue
            jouables+=("$nom")
          done

          # Fichiers qui déclenchent : skills, agents, hooks d'un plugin ; son
          # banc et son bruit ; et, pour tous les plugins à la fois, l'outillage,
          # le comparateur et ce workflow. Le journal des résultats seul ne
          # déclenche rien : y ajouter une ligne ne change aucune mesure.
          touches=()
          for f in "${fichiers[@]}"; do
            case "$f" in
              plugins/*/skills/*|plugins/*/agents/*|plugins/*/hooks/*)
                n=${f#plugins/}; touches+=("${n%%/*}") ;;
              evals/RESULTATS.md) ;;
              evals/bruit-*.json)
                n=${f#evals/bruit-}; touches+=("${n%.json}") ;;
              evals/*/*)
                n=${f#evals/}; n=${n%%/*}
                if [ -d "plugins/$n" ]; then touches+=("$n"); else global=1; fi ;;
              evals/*|scripts/evals_ab.py|scripts/evals_selection.py|.github/workflows/ci.yml) global=1 ;;
            esac
          done

          choisis=()
          for nom in "${jouables[@]}"; do
            if [ "$global" = 1 ]; then choisis+=("$nom"); continue; fi
            for t in "${touches[@]}"; do
              if [ "$t" = "$nom" ]; then choisis+=("$nom"); break; fi
            done
          done

          # Le plancher : pour chaque plugin joué, quels cas, et lesquels on ne
          # peut pas omettre (scripts/evals_selection.py, testé). Il lit le corps
          # de la PR dans PR_BODY ; en lancement manuel il n'y en a pas, donc
          # « tout ». Un refus (code 1) ou une panne (code 2) rend le job rouge :
          # `evals` est alors sauté, et `evals-verdict` le voit.
          # Sans le label `evals`, rien ne se joue, mais le script tourne quand même
          # pour chaque plugin dont un skill, un agent ou un hook change : il refuse
          # la PR qui n'a ni label ni ligne « Evals: aucun — <raison> ».
          if grep -qixF evals <<<"$LABELS"; then
            a_le_label=1
            a_verifier=("${choisis[@]}")
          else
            a_le_label=0
            a_verifier=()
            for t in "${touches[@]}"; do
              case " ${a_verifier[*]-} " in *" $t "*) ;; *) a_verifier+=("$t") ;; esac
            done
          fi
          # --- label ajouté (début)
          # Un `labeled` dont le label n'est pas `evals` (`review-required` posé sur
          # une PR qui porte déjà `evals`) ne doit pas relancer le banc payant : on
          # ne joue rien. Le contrôle « label ou aucun » ci-dessous, lui, tourne
          # quand même : le sauter rendrait vert, sur ce SHA, un run que le
          # précédent avait rendu rouge (le trou de `edited`, décrit en tête).
          joue=1
          if [ -n "${LABEL_AJOUTE-}" ] && [ "${LABEL_AJOUTE,,}" != "evals" ]; then
            joue=0
            echo "Label « $LABEL_AJOUTE » ajouté : ce n'est pas « evals », les évals ne sont pas relancées."
          fi
          # --- label ajouté (fin)
          liste="$RUNNER_TEMP/fichiers-touches.txt"
          : > "$liste"
          if [ "${#fichiers[@]}" -gt 0 ]; then printf '%s\n' "${fichiers[@]}" > "$liste"; fi
          selection='{}'
          refus=0
          for nom in "${a_verifier[@]}"; do
            if sel=$(python3 scripts/evals_selection.py --plugin "$nom" --fichiers "$liste" --labels "$LABELS" 2>"$RUNNER_TEMP/selection.err"); then
              selection=$(jq -c --arg p "$nom" --argjson s "$sel" '. + {($p): $s}' <<<"$selection")
            else
              refus=1
              # Une seule ligne : le message peut citer du texte du corps de la PR.
              echo "::error title=Évals non couvertes ($nom)::$(tr '\n\r' '  ' < "$RUNNER_TEMP/selection.err")"
            fi
          done

          # Sans label `evals`, ou sur un label étranger : rien à jouer.
          if [ "$a_le_label" = 0 ] || [ "$joue" = 0 ]; then
            choisis=()
            selection='{}'
          fi
          if [ "${#choisis[@]}" -gt 0 ]; then
            plugins=$(printf '%s\n' "${choisis[@]}" | jq -R . | jq -cs .)
            touche=true
          else
            plugins=""
            touche=false
          fi
          {
            echo "touche=$touche"
            echo "plugins=$plugins"
            echo "base=$base"
            echo "selection=$selection"
          } >> "$GITHUB_OUTPUT"
          echo "base=$base touche=$touche plugins=${plugins:-aucun}"
          {
            echo "### Portée des évals"
            echo
            if [ "$selection" = '{}' ]; then
              if [ "$joue" = 0 ]; then
                echo "Aucun plugin à jouer (label « $LABEL_AJOUTE » ajouté, pas « evals »)."
              elif [ "$a_le_label" = 0 ]; then
                echo "Aucun plugin à jouer (pas de label evals sur la PR)."
              else
                echo "Aucun plugin à jouer."
              fi
            else
              jq -r 'to_entries[] | "- **\(.key)** : " + (if .value.tout then "tout le banc (\(.value.cas | length) cas) — \(.value.pourquoi_tout | .[0:200])" else "\(.value.categories | join(", ")) (\(.value.cas | length) cas)" end)' <<<"$selection"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$refus"

  evals:
    name: Évals (${{ matrix.plugin }})
    needs: evals-portee
    # Sauté quand rien n'est à jouer : la PR ne touche ni skill, ni agent, ni
    # hook, ni banc, ou — le cas courant — elle ne porte pas le label `evals`.
    # Un job sauté compte comme réussi, `merge-auto` continue.
    if: needs.evals-portee.outputs.touche == 'true'
    runs-on: ubuntu-latest
    # Sans base en cache (premier run de chaque base) : deux bras joués l'un
    # après l'autre, de 16 cas x 3 passages = 48 passages au plus (« tout »).
    # Mesuré le 2026-09-30 (A/A local de l'étape A4, 27 passages en ≈ 24 min à
    # 3 agents en parallèle) : ≈ 2,7 min par passage. À 5 agents en parallèle
    # (EVALS_CONCURRENCE), 48 passages x 2,7 min / 5 ≈ 26 min par bras, soit
    # ≈ 52 min pour les deux, plus ≈ 1 min 30 de préparation ; une sélection
    # par catégorie joue moins de cas, donc moins. 150 min gardent la marge des
    # cas d'exécution (Bash, commits), sans doute plus lents que les cas de
    # lecture mesurés, et d'un débit qui ne monterait pas linéairement avec la
    # concurrence, sans tolérer une boucle : au-delà, le job est tué plutôt que
    # de consommer l'abonnement.
    timeout-minutes: 150
    permissions:
      contents: read
    # Un seul banc à la fois par plugin : tous les bancs partagent la limite de
    # débit d'un même abonnement, et trois bancs simultanés (le 2026-09-30) ont
    # rendu des mesures inexploitables. Le second attend donc la fin du premier,
    # sans l'annuler. Limite de GitHub : un seul run peut attendre par groupe ;
    # un troisième annule celui qui attendait. Au niveau du job (et non du
    # workflow), pour ne jamais interrompre `merge-auto` en plein merge.
    concurrency:
      # Ni la PR ni la ref n'entrent dans le groupe, sinon deux PR ne
      # s'attendraient pas. Le bruit (`aa`) garde un groupe à part, pour qu'une
      # mesure payée n'en annule pas une autre (hors lancement manuel,
      # `inputs.mode` est vide : `ab`).
      group: evals-${{ inputs.mode == 'aa' && 'aa-' || '' }}${{ matrix.plugin }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # « aucun » n'est jamais joué : `if` saute le job avant. Il évite qu'un
        # matrice vide fasse échouer l'évaluation du workflow.
        plugin: ${{ fromJSON(needs.evals-portee.outputs.plugins || '["aucun"]') }}
    env:
      # Figés : un modèle ou un effort de réflexion qui change change le bruit,
      # donc toute la mesure. Décision de Benjamin (étape B9), après une sonde :
      # Sonnet appelle le skill et obtient 90 % contre 95 % pour Opus sur le cas
      # `hook-claude` ; l'effort `high` (≈ 4 800 à 7 800 jetons de réflexion
      # contre ≈ 350 à 550 en `low`) est lu par `claude plugin eval` dans
      # CLAUDE_CODE_EFFORT_LEVEL, que evals/outillage/lancer.sh pose depuis
      # EVALS_EFFORT. Changer l'un des deux, c'est remesurer le bruit (mode `aa`).
      EVALS_MODELE: claude-sonnet-5-5
      EVALS_EFFORT: high
      # Plafond par appel de `claude plugin eval` (une fois pour la base, une fois
      # pour la tête). Mesuré le 2026-09-30 avec Opus (A/A local de
      # l'étape A4) : 54 passages pour 53,14 $, soit ≈ 0,98 $ par passage (de
      # 0,48 à 2,15 $ selon le cas), donc un bras de 16 cas x 3 passages ≈ 47 $.
      # 120 $ couvrent un bras complet avec plus de deux fois de marge, pour les
      # cas d'exécution (Bash, commits) sans doute plus chers que les cas de
      # lecture mesurés. Un plafond plus bas couperait chaque bras : rapport
      # partiel, refusé par `evals_ab.py` (code 3), job rouge à tous les coups.
      EVALS_MAX_COUT_USD: '120'
      EVALS_RUNS: '3'
      # Décision de Benjamin (étape B9) : 5 agents en parallèle.
      EVALS_CONCURRENCE: '5'
    steps:
      - name: Vérifier que le jeton est là
        # Premier pas, avant tout coût : sans jeton, on échoue net et on le dit.
        # Le secret n'est passé qu'à ce pas et au pas qui joue les cas ; jamais
        # en argument de ligne de commande (visible dans la liste des processus).
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error title=Secret absent::Le secret CLAUDE_CODE_OAUTH_TOKEN est vide ou absent : les évals ne peuvent pas s'authentifier. Le poser avec « gh secret set CLAUDE_CODE_OAUTH_TOKEN » (voir docs/tester-un-skill.md, section « Le jeton de CI »)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer le runner
        # Refuse de tourner hors GITHUB_ACTIONS=true (garde-fou du script).
        run: bash evals/outillage/preparer-runner.sh

      - name: Clé du cache de la base
        id: cle
        # L'A/A (`mode: aa`) ne touche pas au cache de la base : il ne joue pas de base.
        if: inputs.mode != 'aa'
        env:
          PLUGIN: ${{ matrix.plugin }}
          BASE_SHA: ${{ needs.evals-portee.outputs.base }}
          SELECTION: ${{ needs.evals-portee.outputs.selection }}
        run: |
          set -euo pipefail
          # Une base rejouée doit donner le même rapport : la clé porte tout ce
          # qui le ferait changer. Le SHA de la base (plugin à cette référence),
          # les cas (assemblés dans les deux copies), la liste des cas joués (une
          # base jouée sur trois cas ne sert pas une comparaison sur seize), le
          # modèle, l'effort de réflexion, le nombre de passages, la version de
          # Claude Code du runner et le lanceur.
          cas=$(git ls-files -z "evals/$PLUGIN" | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)
          joues=$(jq -r --arg p "$PLUGIN" '(.[$p] // {"tout": true}) | if .tout then "tout" else (.cas | sort | join(",")) end' <<<"$SELECTION")
          selec=$(printf '%s' "$joues" | sha256sum | cut -c1-12)
          version=$(sed -n 's/^CLAUDE_CODE_VERSION=//p' evals/outillage/preparer-runner.sh)
          lanceur=$(sha256sum evals/outillage/lancer.sh | cut -c1-12)
          echo "cle=evals-base-$PLUGIN-$BASE_SHA-$cas-s$selec-$EVALS_MODELE-e$EVALS_EFFORT-r$EVALS_RUNS-cc$version-$lanceur" >> "$GITHUB_OUTPUT"

      - name: Reprendre la base du cache
        id: cache
        if: inputs.mode != 'aa'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/evals-cache/base.json
          key: ${{ steps.cle.outputs.cle }}

      - name: Jouer la tête et la base, comparer
        id: jeu
        if: inputs.mode != 'aa'
        env:
          PLUGIN: ${{ matrix.plugin }}
          BASE_SHA: ${{ needs.evals-portee.outputs.base }}
          SELECTION: ${{ needs.evals-portee.outputs.selection }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          sortie="$RUNNER_TEMP/evals-sortie"
          cache="$RUNNER_TEMP/evals-cache"
          journal_log="$RUNNER_TEMP/evals.log"
          mkdir -p "$sortie" "$cache"
          # Traces (--keep-temp) hors de l'artefact : seul $sortie est téléversé.
          export TMPDIR="$RUNNER_TEMP/evals-traces"
          mkdir -p "$TMPDIR"

          args=(--plugin "$PLUGIN" --mode ab --base "$BASE_SHA" --tete HEAD
                --conserver --journal "$sortie/journal.md")
          # Les cas joués : ceux de la sélection, ou tous quand elle dit « tout »
          # (ou qu'elle manque : le défaut est le banc entier, jamais moins).
          if [ "$(jq -r --arg p "$PLUGIN" '(.[$p] // {"tout": true}) | .tout' <<<"$SELECTION")" = "true" ]; then
            echo "Tous les cas du banc sont joués."
          else
            mapfile -t cas < <(jq -r --arg p "$PLUGIN" '.[$p].cas[]' <<<"$SELECTION")
            for c in "${cas[@]}"; do args+=(--cas "$c"); done
            echo "Cas joués (${#cas[@]}) : ${cas[*]}"
          fi
          # Le bruit mesuré n'est utilisé que s'il porte le modèle joué (EVALS_MODELE) :
          # evals_ab.py l'ignore sinon, et le dit dans le tableau.
          if [ -f "evals/bruit-$PLUGIN.json" ]; then
            args+=(--bruit "evals/bruit-$PLUGIN.json")
            echo "Bruit mesuré : evals/bruit-$PLUGIN.json"
          else
            echo "Pas de evals/bruit-$PLUGIN.json : bruit estimé (plus large qu'une mesure)."
          fi
          if [ "$CACHE_HIT" = "true" ]; then
            args+=(--reference "$cache/base.json")
            echo "Base reprise du cache."
          else
            args+=(--garder-base "$cache/base.json")
          fi

          # stdout = le tableau Markdown ; stderr = la trace, qui reste dans le
          # journal du job (jamais téléversée). Aucun `set -x`, aucun `env`.
          set +e
          python3 scripts/evals_ab.py "${args[@]}" -- \
            --runs "$EVALS_RUNS" --concurrency "$EVALS_CONCURRENCE" \
            --report "$sortie/report.html" \
            2>&1 >"$sortie/tableau.md" | tee "$journal_log" >&2
          code=${PIPESTATUS[0]}
          set -e

          # Rapports JSON : le lanceur les écrit dans les copies conservées.
          racine=$(sed -n 's/^copies conservées : //p' "$journal_log" | tail -n 1)
          if [ -n "$racine" ] && [ -d "$racine" ]; then
            [ -f "$racine/tete.json" ] && cp "$racine/tete.json" "$sortie/rapport-tete.json"
            [ -f "$racine/base.json" ] && cp "$racine/base.json" "$sortie/rapport-base.json"
            rm -rf "$racine"
          fi
          if [ ! -f "$sortie/rapport-base.json" ] && [ "$CACHE_HIT" = "true" ]; then
            cp "$cache/base.json" "$sortie/rapport-base.json"
          fi

          {
            echo "## Évals — $PLUGIN"
            echo
            if [ -s "$sortie/tableau.md" ]; then
              cat "$sortie/tableau.md"
            else
              echo "Aucune comparaison produite (code $code) : voir le journal du job."
            fi
            echo
            echo "Rapports JSON, report.html et journal : artefact \`evals-$PLUGIN\`."
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0) ;;
            1) echo "::error title=Recul::La tête de « $PLUGIN » recule au-delà du bruit par rapport à sa base (voir le résumé du job)." ;;
            *) echo "::error title=Évals refusées::evals_ab.py a rendu le code $code pour « $PLUGIN » : pré-vol, rapport partiel (plafond de coût) ou lanceur en échec. Voir le journal du job." ;;
          esac
          exit "$code"

      - name: Mesurer le bruit du modèle (A/A)
        id: aa
        # Lancement manuel seulement (`gh workflow run ci.yml --ref <branche> -f
        # mode=aa`). Joue la tête deux fois, sur tout le banc (aucun filtre de cas), sans
        # base, sans cache et sans lire le bruit existant : c'est ce fichier-ci
        # qu'on produit.
        if: inputs.mode == 'aa'
        env:
          PLUGIN: ${{ matrix.plugin }}
          MODE: ${{ inputs.mode }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          bruit="$RUNNER_TEMP/evals-bruit"
          journal_log="$RUNNER_TEMP/evals-aa.log"
          mkdir -p "$bruit"
          export TMPDIR="$RUNNER_TEMP/evals-traces"
          mkdir -p "$TMPDIR"

          # stdout = le tableau ; stderr = la trace, qui reste dans le journal du
          # job (jamais téléversée). Aucun `set -x`, aucun `env`.
          set +e
          python3 scripts/evals_ab.py --plugin "$PLUGIN" --mode aa --tete HEAD \
            --sortie-bruit "$RUNNER_TEMP/evals-bruit/bruit-$PLUGIN.json" -- \
            --runs "$EVALS_RUNS" --concurrency "$EVALS_CONCURRENCE" \
            2>&1 >"$RUNNER_TEMP/evals-aa-tableau.md" | tee "$journal_log" >&2
          code=${PIPESTATUS[0]}
          set -e

          {
            echo "## Bruit du modèle — $PLUGIN"
            echo
            echo "Mode \`$MODE\` — modèle \`$EVALS_MODELE\`, effort \`$EVALS_EFFORT\`, $EVALS_RUNS passages par cas."
            echo
            if [ -s "$RUNNER_TEMP/evals-aa-tableau.md" ]; then
              cat "$RUNNER_TEMP/evals-aa-tableau.md"
            else
              echo "Aucune mesure produite (code $code) : voir le journal du job."
            fi
            echo
            if [ -s "$bruit/bruit-$PLUGIN.json" ]; then
              echo "Fichier de bruit : artefact \`evals-bruit-$PLUGIN\` (\`bruit-$PLUGIN.json\`)."
              echo "Le télécharger, le commiter en \`evals/bruit-$PLUGIN.json\` dans la PR, puis pousser."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" != 0 ]; then
            echo "::error title=Mesure du bruit refusée::evals_ab.py a rendu le code $code pour « $PLUGIN » : pré-vol, rapport partiel (plafond de coût) ou lanceur en échec. Voir le journal du job."
          fi
          exit "$code"

      - name: Base gardée pour le cache
        id: base
        if: always() && inputs.mode != 'aa' && steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -s "$RUNNER_TEMP/evals-cache/base.json" ]; then
            echo "gardee=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ranger la base dans le cache
        # `always()` : une tête qui recule fait échouer le job, mais la base
        # jouée n'en est pas moins valable. Sans cela, on la rejouerait (et on la
        # repayerait) à chaque nouvelle poussée.
        if: always() && inputs.mode != 'aa' && steps.base.outputs.gardee == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/evals-cache/base.json
          key: ${{ steps.cle.outputs.cle }}

      - name: Vérifier que l'artefact ne contient pas le jeton
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Ceinture avant téléversement. Le motif passe par un descripteur de
          # fichier (`-f <(...)`) et non par un argument : `printf` est interne à
          # bash, le jeton n'apparaît dans la ligne de commande d'aucun processus.
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || exit 0
          # Les deux dossiers téléversés : les rapports (`ab`) et le bruit (`aa`).
          for dossier in "$RUNNER_TEMP/evals-sortie" "$RUNNER_TEMP/evals-bruit"; do
            [ -d "$dossier" ] || continue
            if grep -rqaF -f <(printf '%s\n' "$CLAUDE_CODE_OAUTH_TOKEN") "$dossier"; then
              rm -rf "$dossier"
              echo "::error title=Jeton dans l'artefact::Le jeton figurait dans les fichiers à téléverser : artefact supprimé. Renouveler le secret."
              exit 1
            fi
          done

      - name: Téléverser les rapports
        if: always() && inputs.mode != 'aa'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-${{ matrix.plugin }}
          # Uniquement les rapports (JSON, report.html, tableau, journal). Ni les
          # traces (--keep-temp), ni le journal du job, ni un dossier qui
          # pourrait embarquer l'environnement.
          path: ${{ runner.temp }}/evals-sortie
          if-no-files-found: ignore
          retention-days: 14

      - name: Téléverser le bruit mesuré
        if: always() && inputs.mode == 'aa'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals-bruit-${{ matrix.plugin }}
          # Le seul fichier de bruit (`bruit-<plugin>.json`) : des nombres, le
          # modèle et l'effort. Ni traces, ni journal.
          path: ${{ runner.temp }}/evals-bruit
          if-no-files-found: error
          retention-days: 14

  evals-verdict:
    # Le seul contrôle d'évals au nom fixe : `Évals (<plugin>)` change avec la
    # matrice, et le verrou de `main` ne peut exiger qu'un nom qui ne change pas.
    # Toujours joué (`always()`), sinon un `needs` sauté ferait sauter aussi ce
    # job, et un contrôle exigé qui n'apparaît jamais bloque tout.
    #   - rouge : la portée (refus du plancher) ou un bras des évals a échoué ou
    #     a été annulé (une poussée qui annule le run ne doit pas passer pour vert) ;
    #   - vert : tout est `success`, ou sauté (une PR sans skill touché ne joue
    #     rien, et c'est normal).
    # Aucune copie du dépôt, aucun jeton, aucun droit : il ne lit que les
    # résultats des jobs dont il dépend.
    name: Verdict des évals
    needs: [evals-portee, evals]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Rouge si la portée ou un bras des évals est rouge ou annulé
        env:
          PORTEE: ${{ needs.evals-portee.result }}
          EVALS: ${{ needs.evals.result }}
        run: |
          echo "portée des évals : $PORTEE ; évals : $EVALS"
          for etat in "$PORTEE" "$EVALS"; do
            case "$etat" in
              failure|cancelled)
                echo "::error title=Verdict des évals::La portée des évals ($PORTEE) ou un bras des évals ($EVALS) est rouge ou annulé : voir les jobs « Portée des évals » et « Évals (…) »."
                exit 1 ;;
            esac
          done
          echo "Vert : tout est réussi ou sauté."

  merge-auto:
    name: Merge automatique si tout est vert
    # Sur ce dépôt, merger c'est publier : les postes tirent `main` et le bump
    # de version que le job `garde` impose est la mise à disposition. Ce job
    # n'ajoute donc pas une commodité, il retire un geste — celui qui séparait
    # « la CI est verte » de « c'est en ligne ». Trois garde-fous le bornent :
    # l'auteur (une PR venant d'ailleurs ne se merge jamais seule), le brouillon
    # (une PR en `draft` attend), et le label `review-required`, qui est la
    # porte de sortie quand on veut relire malgré le vert — même nom et même
    # sens que sur `vahiny` et `kanban_mAIster_ATI4`.
    #
    # `evals` attend aussi, et peut être sauté (PR sans skill touché) : d'où
    # `always()` — sans lui, un `needs` sauté fait sauter aussi `merge-auto`.
    # `always()` lève cependant le « tout est vert » implicite : on le rétablit à
    # la main, en n'acceptant que `success` ou `skipped` de chaque amont. Un
    # `failure` ou un `cancelled` (recul des évals, poussée qui annule le run)
    # bloque le merge. `evals-portee` est dans la liste : s'il échoue, `evals`
    # est sauté, et sans lui ce saut passerait pour un feu vert.
    # `evals-verdict` y est aussi : c'est le contrôle que le verrou de `main`
    # exigera, et le merge automatique ne doit pas être plus permissif que lui.
    needs: [garde, validation, evals-portee, evals, evals-verdict]
    if: >-
      always()
      && (needs.garde.result == 'success' || needs.garde.result == 'skipped')
      && (needs.validation.result == 'success' || needs.validation.result == 'skipped')
      && (needs.evals-portee.result == 'success' || needs.evals-portee.result == 'skipped')
      && (needs.evals.result == 'success' || needs.evals.result == 'skipped')
      && (needs.evals-verdict.result == 'success' || needs.evals-verdict.result == 'skipped')
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'benjaminge73'
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'review-required')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merger, puis supprimer la branche distante
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" --merge --delete-branch
