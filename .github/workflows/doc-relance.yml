name: doc-relance

# Relance le job `doc` (« Ligne Doc de la description ») de ci.yml quand la description
# d'une PR change et que sa ligne `Doc :` devient valide. `edited` ne fait pas partie des
# déclencheurs de ci.yml, et c'est voulu (voir son en-tête : une édition rejouerait toute
# la CI et rendrait un « Verdict des évals » vert sur un SHA aux évals rouges) : ce petit
# workflow à part en tient lieu. Avant lui, le job `doc` attendait la ligne en relisant le
# corps toutes les 20 s pendant 10 min, sur un runner facturé.
#
# Il ne relance que si le dernier run ci du commit de tête est fini avec `doc` en échec, et
# il ne relance QUE `doc` (`gh run rerun --job`) : GitHub rejoue alors aussi ses
# dépendants (`merge-auto`), sans refaire `validation`, et sans rejouer un bras d'évals ou
# de fumée rouge (des jetons Claude que seul Benjamin décide de dépenser).
on:
  pull_request:
    types: [edited]

concurrency:
  group: doc-relance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  relance:
    name: relance
    if: >-
      github.event.changes.body != null
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/garde_doc_pr.py
          sparse-checkout-cone-mode: false

      - name: Relancer `doc` si la ligne Doc est devenue valide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          PR_BODY=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""') || {
            echo "::error::lecture du corps de la PR impossible (panne de l'API, pas un refus)"
            exit 2
          }
          export PR_BODY
          if ! python3 scripts/garde_doc_pr.py; then
            echo "Ligne Doc pas encore valide : rien à relancer (le job doc de ci.yml porte le rouge)."
            exit 0
          fi
          read -r run_id statut < <(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id // "") \(.status // "")"')
          if [ -z "$run_id" ]; then
            echo "Aucun run ci pour $HEAD_SHA : rien à relancer."
            exit 0
          fi
          read -r job_id doc < <(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "Ligne Doc de la description")][0] | "\(.id // "") \(.conclusion // "")"')
          if [ "$doc" != failure ]; then
            echo "doc = « ${doc:-pas encore joué} » sur le run $run_id : rien à relancer."
            exit 0
          fi
          if [ "$statut" != completed ]; then
            echo "::warning::run $run_id encore en cours : le relancer une fois fini (gh run rerun --job $job_id)."
            exit 0
          fi
          gh run rerun --job "$job_id" --repo "$REPO"
          echo "Run $run_id relancé : doc (job $job_id), puis merge-auto."
